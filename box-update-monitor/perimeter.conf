# Périmètre surveillé par box-update-monitor
# Format : MODE<TAB ou espaces>CHEMIN
#   full    = manifeste (taille/sha256/mtime) + copie des fichiers texte (diff ligne à ligne)
#   hash    = manifeste seulement (binaires / gros arbres tiers : on voit QUELS fichiers changent)
#   exclude = motif glob (fnmatch) exclu partout
#
# --- Runtime agent (exec-daemon : Shell, Read, computer-use, MCP, gh/rg/node embarqués) ---
full     /exec-daemon
# --- Host Grok Bot dans la box (sand-host : host-main.cjs, workers, extensions, box-scripts, officekit) ---
full     /opt/sand
# --- Scripts/lanceurs installés par l'image + le superviseur (start-sand-box, sand-supervisor*.mjs, box-doctor, box-chrome...) ---
full     /usr/local/bin
full     /usr/local/libexec/sand
hash     /usr/local/libexec/printing-press
full     /usr/local/share/sand-box-scripts
full     /usr/local/share/sand-webauthn-proxy
full     /usr/local/share/sand-webauthn-proxy-update.xml
full     /usr/local/share/sand-webauthn-proxy.id
hash     /usr/local/share/sand-webauthn-proxy.crx
# --- Marqueurs d'image + daemons root (orbitd) ---
full     /etc/sand-box-image-sha
full     /etc/opt/chrome
full     /var/lib/sand-daemon-supervisor
# --- Docs/skills livrés par l'app ---
full     /home/box/reference
full     /home/box/.cursor/skills-cursor
full     /home/box/sand-data/managed-skills
# (exclus volontairement : /home/box/sand-data/plugins et plugin-skills = connecteurs installés par
#  l'utilisateur -> donnée propre au compte, et ça bouge avec ses connecteurs, pas avec les updates box)
# --- Outils tiers préinstallés dans l'image (hash seulement : bruit élevé, diff texte peu utile) ---
hash     /usr/local/lib/node_modules
hash     /usr/local/lib/pnpm
hash     /usr/local/lib/python3.13
hash     /usr/local/share/corepack
hash     /opt/google/chrome
#
# --- Exclusions (bruit) ---
exclude  */__pycache__/*
exclude  *.pyc
exclude  /var/lib/sand-daemon-supervisor/orbitd/staging*
exclude  /var/lib/sand-daemon-supervisor/orbitd/state.json
